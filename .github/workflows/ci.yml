# Pre-merge gate. Fails the branch in GitHub on any regression that
# `make test` would catch locally — eslint, tsc, or the unit test project.
#
# Runs on:
#   - direct push to main (direct commits / fast-forwards)
#   - PR targeting main (before merge)
#
# Integration + security probe suites are NOT in this workflow — they require
# the local Supabase stack (Docker). When CI grows a Supabase step, add an
# `integration` job here that depends on it.
#
# The jobs run in parallel so a single failure shows alongside the others, not
# in series. In-flight runs for the same ref are cancelled when a new commit
# lands so a long queue can't shadow newer fixes.
#
# Actions are pinned by commit SHA, not tag: a tag can be moved to point at new
# code, and these jobs run on every PR from any contributor.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: workers/push
      - run: npx vitest run --project unit

  # `supabase/functions/` is in NO tsconfig, so `npx tsc -b` never looks at it.
  # The Deno edge modules are only type-checked here: tsc -b cannot read them
  # (jsr:/npm:/https: specifiers), so a broken import or a renamed export there
  # surfaces as the function 503-ing on boot after deploy.
  #
  # This used to skip every module that reached an npm: specifier, because
  # resolving those dragged in the frontend dependency tree and reported errors
  # from unrelated @types. scripts/deno-check.json fixes that at the root with
  # nodeModulesDir=none — Deno resolves npm from its own cache and never looks at
  # node_modules — so all of them are checked now and the taint-set machinery is
  # gone.
  edge-typecheck:
    name: deno check (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x
      - run: bash scripts/check-edge.sh
